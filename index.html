<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F5F0;--surface:#FFFFFF;--surface2:#F0EDE6;--border:#E4E0D8;--border2:#D0CBBF;
    --text:#1A1916;--text2:#6B6760;--text3:#9E9B95;
    --green:#2D6A4F;--green-bg:#EAF4EE;--green-text:#1E5C3A;
    --amber:#92580A;--amber-bg:#FEF3E2;--amber-text:#7A4A08;
    --red:#C0392B;--red-bg:#FDECEA;--red-text:#A93226;
    --blue:#1A5C8A;--blue-bg:#EAF2FA;--blue-text:#154F78;
    --accent:#3D6B4F;--radius:12px;--radius-sm:8px;
    --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:0 4px 12px rgba(0,0,0,0.08),0 2px 4px rgba(0,0,0,0.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5}

  /* ── Layout ── */
  .app{display:flex;min-height:100vh}
  .sidebar{width:252px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
  .sidebar-brand{padding:24px 20px 16px;border-bottom:1px solid var(--border)}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .brand-icon{width:34px;height:34px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .brand-name{font-family:'DM Serif Display',serif;font-size:19px;line-height:1.2}
  .brand-sub{font-size:11px;color:var(--text3)}

  /* ── Home switcher ── */
  .home-switcher{padding:10px 12px;border-bottom:1px solid var(--border)}
  .home-switcher-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;padding:0 4px}
  .home-pill{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;border:none;background:none;width:100%;text-align:left;position:relative}
  .home-pill:hover{background:var(--surface2);color:var(--text)}
  .home-pill.active{background:var(--surface2);color:var(--text);font-weight:500}
  .home-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .home-pill-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .home-pill-count{font-size:10px;color:var(--text3)}
  .home-pill.all-homes .home-dot{background:linear-gradient(135deg,#3D6B4F 50%,#1A5C8A 50%)}
  .add-home-btn{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text3);border:1px dashed var(--border2);background:none;width:100%;transition:all .15s;margin-top:6px}
  .home-pill-row{display:flex;align-items:center;gap:4px}
  .home-pill-row .home-pill{flex:1}
  .home-edit-btn{flex-shrink:0;padding:5px 7px;border:none;background:none;cursor:pointer;color:var(--text3);border-radius:var(--radius-sm);font-size:11px;transition:all .15s;opacity:0}
  .home-pill-row:hover .home-edit-btn{opacity:1}
  .home-edit-btn:hover{background:var(--surface2);color:var(--text)}
  .add-home-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--green-bg)}

  .sidebar-nav{padding:12px 12px;flex:1;overflow-y:auto}
  .nav-section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;margin-bottom:4px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;color:var(--text2);transition:all .15s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left}
  .nav-item:hover{background:var(--surface2);color:var(--text)}
  .nav-item.active{background:var(--accent);color:#fff;font-weight:500}
  .nav-item.active .nav-badge{background:rgba(255,255,255,.25);color:#fff}
  .nav-icon{font-size:15px;width:18px;text-align:center}
  .nav-badge{margin-left:auto;background:var(--red-bg);color:var(--red);font-size:10px;font-weight:600;padding:2px 6px;border-radius:20px;min-width:18px;text-align:center}

  .sidebar-footer{padding:14px 12px;border-top:1px solid var(--border)}
  .add-btn{width:100%;padding:9px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s}
  .add-btn:hover{opacity:.88}

  /* ── Main ── */
  .main{margin-left:252px;flex:1;min-height:100vh}
  .page{display:none;padding:32px 36px;max-width:940px}
  .page.active{display:block}
  .page-header{margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .page-title{font-family:'DM Serif Display',serif;font-size:26px;line-height:1.2}
  .page-sub{font-size:13px;color:var(--text3);margin-top:3px}

  /* ── Stats ── */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .stat-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .stat-num{font-size:26px;font-weight:600;line-height:1}
  .stat-num.danger{color:var(--red)}
  .stat-num.success{color:var(--green)}
  .stat-num.amber{color:var(--amber)}

  /* ── Home color tag ── */
  .home-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500}

  /* ── Task cards ── */
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .section-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
  .task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:7px;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s}
  .task-card:hover{box-shadow:var(--shadow-md);border-color:var(--border2)}
  .task-card.overdue{border-left:3px solid var(--red)}
  .task-card.warning{border-left:3px solid #E8A020}
  .task-top{display:flex;align-items:flex-start;gap:12px}
  .task-emoji{font-size:24px;line-height:1;padding-top:2px}
  .task-body{flex:1;min-width:0}
  .task-name{font-weight:600;font-size:14.5px}
  .task-meta{font-size:11.5px;color:var(--text3);margin-top:2px}
  .task-vendor{font-size:11.5px;color:var(--text2);margin-top:1px}
  .task-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:10.5px;font-weight:600}
  .badge-ok{background:var(--green-bg);color:var(--green-text)}
  .badge-warn{background:var(--amber-bg);color:var(--amber-text)}
  .badge-due{background:var(--red-bg);color:var(--red-text)}
  .task-progress{margin-top:9px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden}
  .task-progress-fill{height:100%;border-radius:2px;transition:width .4s}
  .task-actions{display:flex;gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}

  /* ── Buttons ── */
  .btn{padding:5px 11px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:4px}
  .btn:hover{background:var(--surface2)}
  .btn-primary{background:var(--accent);color:white;border-color:var(--accent)}
  .btn-primary:hover{opacity:.88;background:var(--accent)}
  .btn-danger{color:var(--red);border-color:var(--red-bg)}
  .btn-danger:hover{background:var(--red-bg)}
  .btn-sm{padding:4px 9px;font-size:11px}

  /* ── Empty ── */
  .empty{text-align:center;padding:40px 24px;color:var(--text3)}
  .empty-icon{font-size:36px;display:block;margin-bottom:10px;opacity:.5}
  .empty-text{font-size:14px;margin-bottom:3px;color:var(--text2)}
  .empty-sub{font-size:12px}

  /* ── History ── */
  .history-table{width:100%;border-collapse:collapse}
  .history-table th{text-align:left;font-size:10.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:8px 14px;border-bottom:1px solid var(--border)}
  .history-table td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
  .history-table tr:last-child td{border-bottom:none}
  .history-table tr:hover td{background:var(--surface2)}
  .cost-cell{font-weight:600;color:var(--green)}

  /* ── P&L ── */
  .pl-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}
  .pl-section-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2)}
  .pl-section-title{font-size:12px;font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.04em}
  .pl-section-total{font-size:13px;font-weight:600;color:var(--green)}
  .pl-table{width:100%;border-collapse:collapse}
  .pl-table th{text-align:left;font-size:10.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:9px 18px;border-bottom:1px solid var(--border)}
  .pl-table th:last-child{text-align:right}
  .pl-table td{padding:10px 18px;font-size:12.5px;border-bottom:1px solid var(--border);vertical-align:middle}
  .pl-table tr:last-child td{border-bottom:none}
  .pl-table tr:hover td{background:var(--surface2)}
  .pl-table td:last-child{text-align:right;font-weight:600;color:var(--green)}
  .pl-home-row td{font-weight:700;font-size:13px;padding:10px 18px;border-top:2px solid var(--border)}
  .pl-cat-row td{background:var(--surface2);font-weight:600;font-size:11px;color:var(--text2);padding:6px 18px}
  .pl-total-row td{background:var(--surface);font-weight:700;font-size:14px;border-top:2px solid var(--border2)!important}
  .pl-total-row td:last-child{color:var(--green);font-size:15px}
  .bar-wrap{display:flex;align-items:center;gap:8px;min-width:100px}
  .bar-track{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;border-radius:3px;transition:width .4s}
  .month-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;padding:18px}
  .month-col{display:flex;flex-direction:column;align-items:center;gap:3px}
  .month-bar-wrap{height:72px;display:flex;align-items:flex-end;width:100%}
  .month-stacked{width:100%;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;min-height:2px}
  .month-segment{width:100%;min-height:1px}
  .month-label{font-size:9.5px;color:var(--text3);font-weight:500}
  .month-amt{font-size:9.5px;color:var(--text2);font-weight:600;white-space:nowrap}
  .pl-empty{text-align:center;padding:36px;color:var(--text3)}
  .pl-notice{background:var(--blue-bg);border:1px solid #B5D4F4;border-radius:var(--radius-sm);padding:11px 14px;font-size:12.5px;color:var(--blue-text);margin-bottom:18px;display:flex;gap:8px;align-items:flex-start}
  .legend{display:flex;flex-wrap:wrap;gap:10px;padding:12px 18px;border-top:1px solid var(--border)}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
  .legend-dot{width:10px;height:10px;border-radius:50%}


  /* ── Documents ── */
  .doc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
  .doc-row:last-child{border-bottom:none}
  .doc-icon{font-size:22px;flex-shrink:0}
  .doc-info{flex:1;min-width:0}
  .doc-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .doc-meta{font-size:11px;color:var(--text3);margin-top:2px}
  .doc-actions{display:flex;gap:5px;flex-shrink:0}
  .upload-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:all .15s;margin-top:6px}
  .upload-zone:hover,.upload-zone.drag-over{border-color:var(--accent);background:var(--green-bg)}
  .upload-icon{font-size:28px;margin-bottom:6px}
  .upload-text{font-size:13px;font-weight:500;color:var(--text2)}
  .upload-sub{font-size:11px;color:var(--text3);margin-top:3px}

  /* ── Modal ── */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,25,22,.5);z-index:200;align-items:center;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:var(--radius);padding:24px;width:95%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slideUp .2s ease}
  @keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .modal-title{font-size:16px;font-weight:600}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);padding:2px 6px;border-radius:6px}
  .modal-close:hover{background:var(--surface2);color:var(--text)}

  /* ── Form ── */
  .form-group{margin-bottom:13px}
  .form-label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
  .form-input{width:100%;padding:8px 11px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13.5px;background:var(--surface);color:var(--text);transition:border-color .12s}
  .form-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,107,79,.1)}
  textarea.form-input{resize:vertical;min-height:64px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
  .divider{border:none;border-top:1px solid var(--border);margin:14px 0}
  .template-cat{font-size:10.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;margin-top:10px}
  .template-grid{display:flex;flex-wrap:wrap;gap:5px}
  .template-chip{padding:4px 9px;border:1px solid var(--border);border-radius:20px;font-size:11.5px;cursor:pointer;background:var(--surface2);color:var(--text);transition:all .12s;display:inline-flex;align-items:center;gap:4px}
  .template-chip:hover{background:var(--accent);color:white;border-color:var(--accent)}
  .hist-row{padding:9px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
  .hist-row:last-child{border-bottom:none}
  .hist-date{font-size:11px;color:var(--text3);min-width:84px}
  .hist-info{flex:1}
  .hist-vendor{font-size:11px;color:var(--text2)}
  .hist-cost{font-weight:600;color:var(--green);font-size:12.5px}
  .hist-notes{font-size:11px;color:var(--text3);margin-top:2px;font-style:italic}

  /* Home color swatches */
  .color-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
  .color-swatch:hover{transform:scale(1.15)}
  .color-swatch.selected{border-color:var(--text);transform:scale(1.15)}

  @media print{
    .sidebar,.add-btn,.task-actions,.btn{display:none!important}
    .main{margin-left:0!important}
    .page{display:block!important;padding:16px!important}
    #page-dashboard,#page-tasks,#page-history{display:none!important}
    #page-pl{display:block!important}
    .pl-section{box-shadow:none!important;border:1px solid #ccc!important}
    body{background:white!important}
  }
  @media(max-width:720px){
    .sidebar{width:200px}.main{margin-left:200px}
    .page{padding:20px 16px}.stats{grid-template-columns:1fr 1fr}
    .form-row{grid-template-columns:1fr}
  }
  @media(max-width:520px){
    .sidebar{display:none}.main{margin-left:0}
  }
</style>
</head>
<body>
<div class="app">

<!-- ══ SIDEBAR ══ -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-row">
      <div class="brand-icon">🏡</div>
      <div class="brand-name">Home Manager</div>
    </div>
    <div class="brand-sub">Your properties, organized</div>
  </div>

  <div class="home-switcher">
    <div class="home-switcher-label">Properties</div>
    <div id="home-list"></div>
    <button class="add-home-btn" onclick="openAddHome()">＋ Add property</button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section-label">Views</div>
    <button class="nav-item active" onclick="switchPage('dashboard',this)" id="nav-dashboard">
      <span class="nav-icon">📊</span> Dashboard
      <span class="nav-badge" id="badge-overdue" style="display:none">0</span>
    </button>
    <button class="nav-item" onclick="switchPage('tasks',this)" id="nav-tasks">
      <span class="nav-icon">🔧</span> All Tasks
    </button>
    <button class="nav-item" onclick="switchPage('history',this)" id="nav-history">
      <span class="nav-icon">📋</span> History
    </button>
    <button class="nav-item" onclick="switchPage('pl',this)" id="nav-pl">
      <span class="nav-icon">💰</span> P&amp;L Report
    </button>
  </nav>

  <div class="sidebar-footer">
    <button class="add-btn" onclick="openAddTask()">＋ Add Task</button>
  </div>
</aside>

<!-- ══ MAIN ══ -->
<main class="main">

  <!-- Dashboard -->
  <div class="page active" id="page-dashboard">
    <div class="page-header">
      <div><div class="page-title">Dashboard</div><div class="page-sub" id="dash-date"></div></div>
    </div>
    <div class="stats" id="stats-grid"></div>
    <div class="section-header"><span class="section-title">🔴 Needs Attention</span></div>
    <div id="due-list"></div>
    <div class="section-header" style="margin-top:24px"><span class="section-title">📅 Coming Up This Year</span></div>
    <div id="upcoming-list"></div>
  </div>

  <!-- All Tasks -->
  <div class="page" id="page-tasks">
    <div class="page-header">
      <div><div class="page-title">All Tasks</div><div class="page-sub" id="tasks-sub"></div></div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap" id="filter-bar"></div>
    <div id="all-tasks-list"></div>
  </div>

  <!-- History -->
  <div class="page" id="page-history">
    <div class="page-header">
      <div><div class="page-title">History</div><div class="page-sub">Every completed job, cost &amp; vendor</div></div>
    </div>
    <div class="stats" id="history-stats" style="grid-template-columns:repeat(3,1fr)"></div>
    <div id="history-content"></div>
  </div>

  <!-- P&L -->
  <div class="page" id="page-pl">
    <div class="page-header">
      <div>
        <div class="page-title">P&amp;L Report</div>
        <div class="page-sub">Home maintenance spending — tax record &amp; annual summary</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select class="form-input" id="pl-year" style="width:108px;padding:7px 10px" onchange="renderPL()"></select>
        <button class="btn btn-primary" onclick="window.print()">🖨 Print / PDF</button>
      </div>
    </div>
    <div id="pl-content"></div>
  </div>

</main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ══ CONSTANTS ══
const SK  = 'hm-tasks-v4';
const HK  = 'hm-history-v4';
const HOK = 'hm-homes-v4';
const DOK = 'hm-docs-v4';
const ACK = 'hm-active-home-v4';

const HOME_COLORS = [
  {id:'green', hex:'#3D6B4F', light:'#EAF4EE', name:'Forest'},
  {id:'blue',  hex:'#1A5C8A', light:'#EAF2FA', name:'Ocean'},
  {id:'amber', hex:'#92580A', light:'#FEF3E2', name:'Amber'},

// ══ STATE ══
let homes   = [];
let tasks   = [];
let history = [];
let activeHomeId = 'all'; // 'all' or a home id
let docs = []; // {id, taskId, histId(optional), name, type, size, data, uploadedAt}
let activeFilter = 'All';

// ══ DATA ══
function loadData(){
  try{ homes   = JSON.parse(localStorage.getItem(HOK))||[]; }catch(e){ homes=[]; }
  try{ tasks   = JSON.parse(localStorage.getItem(SK)) ||[]; }catch(e){ tasks=[]; }
  try{ docs    = JSON.parse(localStorage.getItem(DOK))||[]; }catch(e){ docs=[]; }
  try{ history = JSON.parse(localStorage.getItem(HK)) ||[]; }catch(e){ history=[]; }
  try{ activeHomeId = localStorage.getItem(ACK)||'all'; }catch(e){}
  // Ensure default home if none
  if(homes.length===0){
    homes.push({id:'home1',name:'My Home',color:'green',address:''});
    localStorage.setItem(HOK,JSON.stringify(homes));
  }
  // Assign orphaned tasks to first home
  tasks.forEach(t=>{ if(!t.homeId) t.homeId=homes[0].id; });
  history.forEach(h=>{ if(!h.homeId) h.homeId=homes[0].id; });
  if(activeHomeId!=='all' && !homes.find(h=>h.id===activeHomeId)) activeHomeId='all';
}

function saveData(){
  localStorage.setItem(SK, JSON.stringify(tasks));
  localStorage.setItem(DOK, JSON.stringify(docs));
  localStorage.setItem(HK, JSON.stringify(history));
  localStorage.setItem(HOK, JSON.stringify(homes));
  localStorage.setItem(ACK, activeHomeId);
}

function homeColor(homeId){
  const home = homes.find(h=>h.id===homeId);
  return HOME_COLORS.find(c=>c.id===(home?.color||'green')) || HOME_COLORS[0];
}

function visibleTasks(){
  if(activeHomeId==='all') return tasks;
  return tasks.filter(t=>t.homeId===activeHomeId);
}

function visibleHistory(){
  if(activeHomeId==='all') return history;
  return history.filter(h=>h.homeId===activeHomeId);
}

// ══ TASK LOGIC ══
function monthsUntilDue(t){
  if(!t.lastDone) return -(t.intervalMonths||12);
  const due = new Date(t.lastDone);
  due.setMonth(due.getMonth()+(t.intervalMonths||12));
  return (due-new Date())/(1000*60*60*24*30.44);
}
function statusOf(t){
  const m=monthsUntilDue(t);
  if(!t.lastDone||m<0) return 'due';
  if(m<2) return 'warn';
  return 'ok';
}
function dueLabel(t){
  const m=monthsUntilDue(t);
  if(!t.lastDone) return 'Never done';
  if(m<0){ return `Overdue ${Math.abs(Math.round(m))} mo`; }
  if(m<1) return 'Due this month';
  if(m<2) return 'Due next month';
  return `Due in ${Math.round(m)} mo`;
}
function fmtDate(d){
  if(!d) return '—';
  return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtMoney(v){
  if(v===null||v===undefined||v==='') return '';
  return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
}
function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══ HOME TAG HTML ══
function homeTagHtml(homeId){
  if(homes.length<=1) return '';
  const home=homes.find(h=>h.id===homeId);
  if(!home) return '';
  const c=homeColor(homeId);
  return `<span class="home-tag" style="background:${c.light};color:${c.hex}">${home.name}</span>`;
}

// ══ TASK CARD ══
function makeTaskCard(t){
  const status=statusOf(t);
  const m=monthsUntilDue(t);
  const pct=t.lastDone?Math.min(100,Math.max(0,Math.round((1-(m/t.intervalMonths))*100))):100;
  const fillColor=status==='due'?'#C0392B':status==='warn'?'#E8A020':'#2D6A4F';
  const badgeClass=status==='due'?'badge-due':status==='warn'?'badge-warn':'badge-ok';
  const div=document.createElement('div');
  div.className=`task-card ${status==='due'?'overdue':status==='warn'?'warning':''}`;
  div.innerHTML=`
    <div class="task-top">
      <div class="task-emoji">${t.icon||'🏠'}</div>
      <div class="task-body">
        <div class="task-name">${esc(t.name)}</div>
        <div class="task-meta">Every ${t.intervalMonths} month${t.intervalMonths===1?'':'s'} · ${esc(t.cat||'General')}</div>
        ${t.vendor?`<div class="task-vendor">Last: <strong>${esc(t.vendor)}</strong>${t.lastCost?' · '+fmtMoney(t.lastCost):''}</div>`:''}
        ${t.lastDone?`<div class="task-meta">Done: ${fmtDate(t.lastDone)}</div>`:`<div class="task-meta" style="color:var(--amber)">⚠ Not yet done</div>`}
        ${t.notes?`<div class="task-meta" style="margin-top:2px;font-style:italic">${esc(t.notes)}</div>`:''}
      </div>
      <div class="task-right">
        <span class="badge ${badgeClass}">${dueLabel(t)}</span>
        ${homes.length>1?homeTagHtml(t.homeId):''}
      </div>
    </div>
    <div class="task-progress"><div class="task-progress-fill" style="width:${pct}%;background:${fillColor}"></div></div>
    <div class="task-actions">
      <button class="btn btn-primary btn-sm" onclick="openMarkDone('${t.id}')">✓ Done</button>
      <button class="btn btn-sm" onclick="openEdit('${t.id}')">✏ Edit</button>
      <button class="btn btn-sm" onclick="openTaskHistory('${t.id}')">📋 Log</button>
      <button class="btn btn-sm" onclick="openDocs('${t.id}')" title="Documents">${docs.filter(d=>d.taskId===t.id).length>0?'📎 '+docs.filter(d=>d.taskId===t.id).length+' doc'+(docs.filter(d=>d.taskId===t.id).length!==1?'s':''):'📎 Docs'}</button>
      <button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">🗑</button>
    </div>`;
  return div;
}

// ══ RENDER HOME LIST ══
function renderHomeSwitcher(){
  const el=document.getElementById('home-list');
  let html='';
  if(homes.length>1){
    html+=`<button class="home-pill all-homes ${activeHomeId==='all'?'active':''}" onclick="setActiveHome('all')">
      <span class="home-dot" style="background:linear-gradient(135deg,${homeColor(homes[0].id).hex} 50%,${homeColor(homes[1].id).hex} 50%)"></span>
      <span class="home-pill-name">All Properties</span>
      <span class="home-pill-count">${tasks.length}</span>
    </button>`;
  }
  homes.forEach(home=>{
    const c=homeColor(home.id);
    const cnt=tasks.filter(t=>t.homeId===home.id).length;
    html+=`<div class="home-pill-row">
      <button class="home-pill ${activeHomeId===home.id?'active':''}" onclick="setActiveHome('${home.id}')">
        <span class="home-dot" style="background:${c.hex}"></span>
        <span class="home-pill-name">${esc(home.name)}</span>
        <span class="home-pill-count">${cnt}</span>
      </button>
      <button class="home-edit-btn" onclick="openEditHome('${home.id}')" title="Edit property">✏</button>
    </div>`;
  });
  el.innerHTML=html;
}

function setActiveHome(id){
  activeHomeId=id;
  activeFilter='All';
  saveData();
  render();
}

// ══ MAIN RENDER ══
function render(){
  renderHomeSwitcher();
  const vTasks=visibleTasks();
  const vHistory=visibleHistory();
  const sorted=[...vTasks].sort((a,b)=>monthsUntilDue(a)-monthsUntilDue(b));
  const overdue=vTasks.filter(t=>statusOf(t)!=='ok');
  const due=sorted.filter(t=>statusOf(t)!=='ok');
  const upcoming=sorted.filter(t=>{const m=monthsUntilDue(t);return m>=2&&m<12;});
  const totalCost=vHistory.reduce((s,h)=>s+(Number(h.cost)||0),0);
  const avgCost=vHistory.filter(h=>h.cost).length?Math.round(totalCost/vHistory.filter(h=>h.cost).length):null;

  // Badge
  const badge=document.getElementById('badge-overdue');
  if(overdue.length>0){badge.textContent=overdue.length;badge.style.display='inline';}
  else badge.style.display='none';

  // Stats
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card"><div class="stat-label">Total Tasks</div><div class="stat-num">${vTasks.length}</div></div>
    <div class="stat-card"><div class="stat-label">Need Attention</div><div class="stat-num danger">${overdue.length}</div></div>
    <div class="stat-card"><div class="stat-label">Due This Year</div><div class="stat-num amber">${upcoming.length}</div></div>
    <div class="stat-card"><div class="stat-label">Avg Job Cost</div><div class="stat-num success">${avgCost?fmtMoney(avgCost):'—'}</div></div>`;

  // Due list
  const dueEl=document.getElementById('due-list');
  dueEl.innerHTML='';
  if(due.length===0) dueEl.innerHTML='<div class="empty"><span class="empty-icon">✅</span><div class="empty-text">All caught up!</div></div>';
  else due.forEach(t=>dueEl.appendChild(makeTaskCard(t)));

  // Upcoming
  const upEl=document.getElementById('upcoming-list');
  upEl.innerHTML='';
  if(upcoming.length===0) upEl.innerHTML='<div class="empty" style="padding:16px"><span class="empty-icon">📅</span><div class="empty-sub">Nothing due in the next year.</div></div>';
  else upcoming.slice(0,6).forEach(t=>upEl.appendChild(makeTaskCard(t)));

  // Tasks sub
  const activeName=activeHomeId==='all'?'All Properties':(homes.find(h=>h.id===activeHomeId)?.name||'');
  document.getElementById('tasks-sub').textContent=activeName+' — '+vTasks.length+' task'+(vTasks.length!==1?'s':'');

  // Filter bar
  const cats=['All',...new Set(vTasks.map(t=>t.cat||'General'))];
  const fb=document.getElementById('filter-bar');
  fb.innerHTML='';
  cats.forEach(c=>{
    const b=document.createElement('button');
    b.className='btn btn-sm'+(c===activeFilter?' btn-primary':'');
    b.textContent=c;
    b.onclick=()=>{activeFilter=c;render();};
    fb.appendChild(b);
  });
  // All tasks
  const allEl=document.getElementById('all-tasks-list');
  allEl.innerHTML='';
  const filtered=activeFilter==='All'?sorted:sorted.filter(t=>(t.cat||'General')===activeFilter);
  if(filtered.length===0) allEl.innerHTML='<div class="empty"><span class="empty-icon">🔧</span><div class="empty-text">No tasks yet</div><div class="empty-sub">Click "Add Task" to get started.</div></div>';
  else filtered.forEach(t=>allEl.appendChild(makeTaskCard(t)));

  // History stats
  const yrAgo=new Date();yrAgo.setFullYear(yrAgo.getFullYear()-1);
  const yrCost=vHistory.filter(h=>h.cost&&new Date(h.date)>=yrAgo).reduce((s,h)=>s+(Number(h.cost)||0),0);
  document.getElementById('history-stats').innerHTML=`
    <div class="stat-card"><div class="stat-label">Total Jobs</div><div class="stat-num">${vHistory.length}</div></div>
    <div class="stat-card"><div class="stat-label">Total Spent</div><div class="stat-num success">${fmtMoney(totalCost)||'—'}</div></div>
    <div class="stat-card"><div class="stat-label">Spent (12 mo)</div><div class="stat-num">${yrCost?fmtMoney(yrCost):'—'}</div></div>`;

  // History table
  const hEl=document.getElementById('history-content');
  hEl.innerHTML='';
  const sortedH=[...vHistory].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(sortedH.length===0){
    hEl.innerHTML='<div class="empty"><span class="empty-icon">📋</span><div class="empty-text">No history yet</div></div>';
  } else {
    const wrap=document.createElement('div');
    wrap.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)';
    wrap.innerHTML=`<table class="history-table"><thead><tr><th>Date</th>${homes.length>1?'<th>Property</th>':''}<th>Task</th><th>Vendor</th><th>Cost</th><th>Notes</th></tr></thead><tbody id="hist-body"></tbody></table>`;
    hEl.appendChild(wrap);
    const tbody=wrap.querySelector('#hist-body');
    sortedH.forEach(h=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td style="white-space:nowrap;color:var(--text2)">${fmtDate(h.date)}</td>${homes.length>1?`<td>${homeTagHtml(h.homeId)}</td>`:''}<td><strong>${esc(h.taskName)}</strong></td><td style="color:var(--text2)">${esc(h.vendor||'—')}</td><td class="cost-cell">${h.cost?fmtMoney(h.cost):'—'}</td><td style="color:var(--text3);font-style:italic;font-size:11px">${esc(h.notes||'')}</td>`;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('dash-date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

function openAddHome(){
  homeModal(null);
}
function openEditHome(id){
  const home=homes.find(h=>h.id===id);
  homeModal(home);
}
function homeModal(home){
  const selectedColor=home?.color||'green';
  const swatches=HOME_COLORS.map(c=>`<div class="color-swatch ${c.id===selectedColor?'selected':''}" style="background:${c.hex}" title="${c.name}" onclick="selectColor('${c.id}')" data-color="${c.id}"></div>`).join('');
  modal(`<div class="modal-header"><div class="modal-title">${home?'Edit Property':'Add Property'}</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="form-group">
      <label class="form-label">Property Name</label>
      <input class="form-input" id="hf-name" placeholder="e.g. Beach House, Main Home" value="${esc(home?.name||'')}">
    </div>
    <div class="form-group">
      <label class="form-label">Address (optional)</label>
      <input class="form-input" id="hf-address" placeholder="123 Main St, City, State" value="${esc(home?.address||'')}">
    </div>
    <div class="form-group">
      <label class="form-label">Color</label>
      <div class="color-swatches" id="color-swatches">${swatches}</div>
    </div>
    <div class="form-footer">
      ${home?`<button class="btn btn-danger" onclick="deleteHome('${home.id}')">Delete</button>`:''}

      <button class="btn btn-primary" onclick="saveHome('${home?.id||''}')">${home?'Save Changes':'Add Property'}</button>
    </div>`);
}
function selectColor(id){
  document.querySelectorAll('#color-swatches .color-swatch').forEach(el=>{
    el.classList.toggle('selected',el.dataset.color===id);
  });
}
function getSelectedColor(){
  const sel=document.querySelector('#color-swatches .color-swatch.selected');
  return sel?sel.dataset.color:'green';
}
function saveHome(editId){
  const name=(document.getElementById('hf-name').value||'').trim();
  if(!name){alert('Please enter a property name.');return;}
  const address=(document.getElementById('hf-address').value||'').trim();
  const color=getSelectedColor();
  if(editId){
    const i=homes.findIndex(h=>h.id===editId);
    if(i>=0) homes[i]={...homes[i],name,address,color};
  } else {
    homes.push({id:'home'+Date.now(),name,address,color});
  }
  saveData();render();closeModal();
}
function deleteHome(id){
  if(homes.length<=1){alert('You need at least one property.');return;}
  if(!confirm('Delete this property? Tasks assigned to it will move to your first property.')) return;
  const fallback=homes.find(h=>h.id!==id)?.id;
  tasks.forEach(t=>{if(t.homeId===id)t.homeId=fallback;});
  history.forEach(h=>{if(h.homeId===id)h.homeId=fallback;});
  homes=homes.filter(h=>h.id!==id);
  if(activeHomeId===id) activeHomeId='all';
  saveData();render();closeModal();
}

      <div class="form-group"><label class="form-label">Category</label><input class="form-input" id="f-cat" list="cat-opts" placeholder="e.g. Plumbing" value="${esc(t?.cat||'')}"><datalist id="cat-opts">${[...new Set(TEMPLATES.map(x=>x.cat))].map(c=>`<option value="${c}">`).join('')}</datalist></div>
    </div>

      <div class="form-group"><label class="form-label">Interval (months)</label><input class="form-input" id="f-interval" type="number" min="1" placeholder="12" value="${t?.intervalMonths||''}"></div>

    </div>

      <div class="form-group"><label class="form-label">Last Cost ($)</label><input class="form-input" id="f-cost" type="number" min="0" placeholder="0" value="${t?.lastCost||''}"></div>
    </div>
    <div class="form-group"><label class="form-label">Vendor</label><input class="form-input" id="f-vendor" placeholder="ABC Services" value="${esc(t?.vendor||'')}"></div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="f-notes" placeholder="Any details...">${esc(t?.notes||'')}</textarea></div>`;
}
function prefill(name){
  const t=TEMPLATES.find(x=>x.name===name);if(!t)return;
  document.getElementById('f-name').value=t.name;
  document.getElementById('f-icon').value=t.icon;
  document.getElementById('f-cat').value=t.cat;
  document.getElementById('f-interval').value=t.months;
  if(t.notes)document.getElementById('f-notes').value=t.notes;
  document.getElementById('f-name').scrollIntoView({behavior:'smooth',block:'center'});
  document.getElementById('f-name').focus();
}
function taskFromForm(existingId){
  const name=(document.getElementById('f-name').value||'').trim();
  if(!name){alert('Please enter a task name.');return null;}
  return {
    id:existingId||'t'+Date.now(),
    name,icon:document.getElementById('f-icon').value||'🏠',
    cat:document.getElementById('f-cat').value||'General',
    intervalMonths:parseInt(document.getElementById('f-interval').value)||12,
    homeId:document.getElementById('f-home').value||homes[0].id,
    lastDone:document.getElementById('f-last').value||null,
    vendor:(document.getElementById('f-vendor').value||'').trim()||null,
    lastCost:document.getElementById('f-cost').value?Number(document.getElementById('f-cost').value):null,
    notes:(document.getElementById('f-notes').value||'').trim()||null,
  };
}
function saveNewTask(){
  const t=taskFromForm(null);if(!t)return;
  tasks.push(t);saveData();render();closeModal();
}
function openEdit(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  modal(`<div class="modal-header"><div class="modal-title">Edit Task</div><button class="modal-close" onclick="closeModal()">×</button></div>
    ${taskForm(t)}
    <div class="form-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEdit('${id}')">Save</button></div>`);
}
function saveEdit(id){
  const t=taskFromForm(id);if(!t)return;
  const i=tasks.findIndex(x=>x.id===id);if(i>=0)tasks[i]=t;
  saveData();render();closeModal();
}

// ══ MARK DONE ══
function openMarkDone(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const home=homes.find(h=>h.id===t.homeId);
  modal(`<div class="modal-header"><div class="modal-title">${t.icon} Mark Done — ${esc(t.name)}</div><button class="modal-close" onclick="closeModal()">×</button></div>
    ${homes.length>1?`<div style="margin-bottom:14px">${homeTagHtml(t.homeId)} <span style="font-size:12px;color:var(--text3)">${esc(home?.address||'')}</span></div>`:''}
    <div class="form-group"><label class="form-label">Date Completed</label><input class="form-input" id="md-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Vendor / Who Did It</label><input class="form-input" id="md-vendor" value="${esc(t.vendor||'')}"></div>
      <div class="form-group"><label class="form-label">Cost ($)</label><input class="form-input" id="md-cost" type="number" min="0" value="${t.lastCost||''}"></div>
    </div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="md-notes" placeholder="Anything worth noting..."></textarea></div>
    <div class="form-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="confirmDone('${id}')">✓ Confirm</button></div>`);
}
function confirmDone(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const date=document.getElementById('md-date').value;
  const vendor=(document.getElementById('md-vendor').value||'').trim();
  const cost=document.getElementById('md-cost').value;
  const notes=(document.getElementById('md-notes').value||'').trim();
  t.lastDone=date;
  if(vendor)t.vendor=vendor;
  if(cost)t.lastCost=Number(cost);
  history.push({id:'h'+Date.now(),taskId:id,taskName:t.name,homeId:t.homeId,date,vendor:vendor||null,cost:cost?Number(cost):null,notes:notes||null});
  saveData();render();closeModal();
}

// ══ TASK HISTORY ══
function openTaskHistory(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const h=history.filter(x=>x.taskId===id).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const rows=h.length===0
    ?'<div class="empty"><span class="empty-icon">📋</span><div class="empty-sub">No history yet.</div></div>'
    :h.map(x=>`<div class="hist-row"><div class="hist-date">${fmtDate(x.date)}</div><div class="hist-info">${x.vendor?`<div class="hist-vendor">${esc(x.vendor)}</div>`:''} ${x.notes?`<div class="hist-notes">${esc(x.notes)}</div>`:''}</div>${x.cost?`<div class="hist-cost">${fmtMoney(x.cost)}</div>`:''}</div>`).join('');
  modal(`<div class="modal-header"><div class="modal-title">${t.icon} ${esc(t.name)}</div><button class="modal-close" onclick="closeModal()">×</button></div>
    ${rows}<div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function deleteTask(id){
  if(!confirm('Delete this task?'))return;
  tasks=tasks.filter(t=>t.id!==id);
  saveData();render();
}

// ══ P&L ══
function populateYearSelector(){
  const years=[...new Set(history.map(h=>new Date(h.date).getFullYear()))];
  const thisYear=new Date().getFullYear();
  if(!years.includes(thisYear))years.push(thisYear);
  years.sort((a,b)=>b-a);
  const sel=document.getElementById('pl-year');if(!sel)return;
  const current=sel.value||String(thisYear);
  sel.innerHTML=years.map(y=>`<option value="${y}" ${y==current?'selected':''}>${y}</option>`).join('');
}

function renderPL(){
  populateYearSelector();
  const sel=document.getElementById('pl-year');
  const year=sel?parseInt(sel.value):new Date().getFullYear();
  const el=document.getElementById('pl-content');if(!el)return;
  const MONTH_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // All history for year (all properties always shown in P&L)
  const yearHist=history.filter(h=>new Date(h.date).getFullYear()===year&&h.cost);

  if(yearHist.length===0){
    el.innerHTML=`<div class="pl-notice">ℹ️ <span>No cost data for ${year}. Enter costs when marking tasks done.</span></div>
      <div class="pl-section"><div class="pl-empty">No records for ${year}.</div></div>`;
    return;
  }

  const totalAll=yearHist.reduce((s,h)=>s+(Number(h.cost)||0),0);

  // Per-home breakdown
  const homeData=homes.map(home=>{
    const hh=yearHist.filter(h=>h.homeId===home.id);
    const total=hh.reduce((s,h)=>s+(Number(h.cost)||0),0);
    return {home,hh,total};
  }).filter(d=>d.hh.length>0);

  // Monthly stacked data per home (for chart)
  const monthlyByHome={};
  homes.forEach(home=>{ monthlyByHome[home.id]=Array(12).fill(0); });
  yearHist.forEach(h=>{ if(monthlyByHome[h.homeId]!==undefined) monthlyByHome[h.homeId][new Date(h.date).getMonth()]+=Number(h.cost)||0; });
  const monthTotals=Array(12).fill(0);
  yearHist.forEach(h=>{ monthTotals[new Date(h.date).getMonth()]+=Number(h.cost)||0; });
  const maxMonth=Math.max(...monthTotals,1);

  // Legend
  const legendHtml=homeData.map(d=>{
    const c=homeColor(d.home.id);
    return `<div class="legend-item"><div class="legend-dot" style="background:${c.hex}"></div>${esc(d.home.name)} <span style="font-weight:600;color:${c.hex}">${fmtMoney(d.total)}</span></div>`;
  }).join('');

  // Month chart with stacked bars
  const monthBarsHtml=monthTotals.map((total,i)=>{
    const segments=homes.map(home=>{
      const amt=monthlyByHome[home.id]?.[i]||0;
      if(!amt)return '';
      const c=homeColor(home.id);
      const h=Math.round((amt/maxMonth)*72);
      return `<div class="month-segment" style="height:${h}px;background:${c.hex};opacity:0.85" title="${home.name}: ${fmtMoney(amt)}"></div>`;
    }).join('');
    return `<div class="month-col">
      <div class="month-amt">${total>0?fmtMoney(total):''}</div>
      <div class="month-bar-wrap"><div class="month-stacked">${segments}</div></div>
      <div class="month-label">${MONTH_ABBR[i]}</div>
    </div>`;
  }).join('');

  // Summary stats row
  let html=`
    <div class="pl-notice">📄 <span>Annual maintenance report for <strong>${year}</strong> — all ${homes.length} propert${homes.length===1?'y':'ies'}. Use Print / PDF to save for tax records.</span></div>

    <div class="stats" style="grid-template-columns:repeat(${Math.min(homes.length+1,4)},1fr);margin-bottom:18px">
      <div class="stat-card"><div class="stat-label">Total — All Homes</div><div class="stat-num success">${fmtMoney(totalAll)}</div></div>
      ${homeData.map(d=>{const c=homeColor(d.home.id);return `<div class="stat-card" style="border-left:3px solid ${c.hex}"><div class="stat-label">${esc(d.home.name)}</div><div class="stat-num" style="color:${c.hex}">${fmtMoney(d.total)}</div></div>`;}).join('')}
    </div>

    <div class="pl-section" style="margin-bottom:18px">
      <div class="pl-section-header"><span class="pl-section-title">📊 Monthly Spending — ${year}</span></div>
      <div class="month-grid">${monthBarsHtml}</div>
      ${homeData.length>1?`<div class="legend">${legendHtml}</div>`:''}
    </div>

    <div class="pl-section">
      <div class="pl-section-header">
        <span class="pl-section-title">📋 Itemized Expenses — ${year}</span>
        <span class="pl-section-total">Total: ${fmtMoney(totalAll)}</span>
      </div>
      <table class="pl-table">
        <thead><tr><th>Date</th>${homes.length>1?'<th>Property</th>':''}<th>Description</th><th>Category</th><th>Vendor</th><th>Amount</th></tr></thead>
        <tbody>`;

  // Group by home → category
  homeData.forEach(({home,hh,total},hi)=>{
    const c=homeColor(home.id);
    if(homes.length>1){
      html+=`<tr class="pl-home-row" style="border-left:3px solid ${c.hex}">
        <td colspan="${homes.length>1?5:4}" style="color:${c.hex}">🏠 ${esc(home.name)}${home.address?` — ${esc(home.address)}`:''}  <span style="font-weight:400;font-size:11px;color:var(--text3)">(${hh.length} job${hh.length!==1?'s':''})</span></td>
        <td style="color:${c.hex}">${fmtMoney(total)}</td>
      </tr>`;
    }
    // by category
    const byCat={};
    hh.forEach(h=>{
      const t=tasks.find(x=>x.id===h.taskId);
      const cat=t?.cat||'General';
      if(!byCat[cat])byCat[cat]=[];
      byCat[cat].push(h);
    });
    Object.entries(byCat).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([cat,items])=>{
      const catTotal=items.reduce((s,h)=>s+(Number(h.cost)||0),0);
      html+=`<tr class="pl-cat-row"><td colspan="${homes.length>1?5:4}">&nbsp;&nbsp;${cat}</td><td style="text-align:right">${fmtMoney(catTotal)}</td></tr>`;
      items.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(h=>{
        const pct=Math.round((Number(h.cost)/totalAll)*100);
        html+=`<tr>
          <td style="white-space:nowrap;color:var(--text2)">${fmtDate(h.date)}</td>
          ${homes.length>1?`<td>${homeTagHtml(h.homeId)}</td>`:''}
          <td><strong>${esc(h.taskName)}</strong></td>
          <td style="color:var(--text3)">${cat}</td>
          <td style="color:var(--text2)">${esc(h.vendor||'—')}</td>
          <td><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${c.hex}"></div></div>${fmtMoney(h.cost)}</div></td>
        </tr>`;
      });
    });
  });

  html+=`<tr class="pl-total-row">
    <td colspan="${homes.length>1?5:4}" style="font-weight:700">TOTAL MAINTENANCE EXPENSES — ${year}</td>
    <td>${fmtMoney(totalAll)}</td>
  </tr></tbody></table></div>

  <div style="font-size:11.5px;color:var(--text3);margin-top:14px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2)">
    <strong>Tax note:</strong> Home maintenance is generally not deductible for a primary residence. Capital improvements that add value or extend the life of the property may affect cost basis at time of sale. Consult your tax advisor for guidance specific to your situation.
  </div>`;

  el.innerHTML=html;
}


// ══ DOCUMENTS ══
function openDocs(taskId){
  const t=tasks.find(x=>x.id===taskId);if(!t)return;
  const taskDocs=docs.filter(d=>d.taskId===taskId);
  renderDocsModal(taskId,taskDocs,t);
}

function renderDocsModal(taskId,taskDocs,t){
  const docRows=taskDocs.length===0
    ?'<div class="empty" style="padding:24px"><span class="empty-icon">📎</span><div class="empty-sub">No documents yet. Upload invoices, warranties, or photos.</div></div>'
    :taskDocs.map(d=>`
      <div class="doc-row" id="doc-${d.id}">
        <span class="doc-icon">${docIcon(d.type)}</span>
        <div class="doc-info">
          <div class="doc-name">${esc(d.name)}</div>
          <div class="doc-meta">${fmtSize(d.size)} · ${fmtDate(d.uploadedAt)}</div>
        </div>
        <div class="doc-actions">
          <button class="btn btn-sm" onclick="downloadDoc('${d.id}')">⬇ Download</button>
          ${d.type.startsWith('image/')?`<button class="btn btn-sm" onclick="previewDoc('${d.id}')">👁 View</button>`:''}
          <button class="btn btn-danger btn-sm" onclick="deleteDoc('${d.id}','${taskId}')">🗑</button>
        </div>
      </div>`).join('');

  modal(`<div class="modal-header">
    <div class="modal-title">📎 ${esc(t.name)} — Documents</div>
    <button class="modal-close" onclick="closeModal()">×</button>
  </div>
  <div id="doc-list">${docRows}</div>
  <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
    <label class="form-label">Upload Document</label>
    <div class="upload-zone" onclick="document.getElementById('file-input-${taskId}').click()" id="upload-zone">
      <div class="upload-icon">📤</div>
      <div class="upload-text">Click to upload or drop files here</div>
      <div class="upload-sub">PDFs, images, Word docs, spreadsheets — max 4MB each</div>
    </div>
    <input type="file" id="file-input-${taskId}" style="display:none" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.doc,.docx,.xls,.xlsx,.txt,.csv" onchange="handleFileUpload(event,'${taskId}')">
    <div id="upload-status" style="font-size:12px;color:var(--text3);margin-top:6px"></div>
  </div>
  <div class="form-footer"><button class="btn" onclick="closeModal()">Close</button></div>`);

  // drag-drop
  const zone=document.getElementById('upload-zone');
  if(zone){
    zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag-over');});
    zone.addEventListener('dragleave',()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');handleFileUpload({target:{files:e.dataTransfer.files}},taskId);});
  }
}

function handleFileUpload(event,taskId){
  const files=Array.from(event.target.files);
  if(!files.length)return;
  const statusEl=document.getElementById('upload-status');
  let processed=0;
  files.forEach(file=>{
    if(file.size>4*1024*1024){
      if(statusEl)statusEl.textContent=`"${file.name}" is too large (max 4MB).`;
      return;
    }
    const reader=new FileReader();
    reader.onload=e=>{
      const doc={
        id:'d'+Date.now()+Math.random().toString(36).slice(2,6),
        taskId,name:file.name,type:file.type||'application/octet-stream',
        size:file.size,data:e.target.result,uploadedAt:new Date().toISOString().slice(0,10)
      };
      docs.push(doc);
      processed++;
      saveData();
      if(processed===files.length){
        const t=tasks.find(x=>x.id===taskId);
        renderDocsModal(taskId,docs.filter(d=>d.taskId===taskId),t);
        render();
      }
    };
    reader.readAsDataURL(file);
  });
}

function downloadDoc(docId){
  const d=docs.find(x=>x.id===docId);if(!d)return;
  const a=document.createElement('a');
  a.href=d.data;a.download=d.name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function previewDoc(docId){
  const d=docs.find(x=>x.id===docId);if(!d)return;
  const win=window.open();
  win.document.write(`<img src="${d.data}" style="max-width:100%;height:auto">`);
}

function deleteDoc(docId,taskId){
  if(!confirm('Delete this document?'))return;
  docs=docs.filter(d=>d.id!==docId);
  saveData();
  const t=tasks.find(x=>x.id===taskId);
  renderDocsModal(taskId,docs.filter(d=>d.taskId===taskId),t);
  render();
}

function docIcon(type){
  if(type==='application/pdf') return '📄';
  if(type.startsWith('image/')) return '🖼';
  if(type.includes('word')||type.includes('document')) return '📝';
  if(type.includes('sheet')||type.includes('excel')||type.includes('csv')) return '📊';
  return '📎';
}

function fmtSize(bytes){
  if(bytes<1024) return bytes+'B';
  if(bytes<1024*1024) return Math.round(bytes/1024)+'KB';
  return (bytes/(1024*1024)).toFixed(1)+'MB';
}

// ══ MODAL UTILS ══
function modal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
}
function handleOverlayClick(e){
  if(e.target===document.getElementById('modal'))closeModal();
}
function switchPage(name,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if(name==='pl')renderPL();
}

// ══ INIT ══
loadData();
render();
</script>
</body>
</html>
